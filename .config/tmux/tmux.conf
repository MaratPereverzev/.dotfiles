set-window-option -g mode-keys vi

bind -n M-R source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"
bind -n M-[ copy-mode

bind -n M-n new-window
bind -n M-L next-window
bind -n M-H previous-window
bind -n M-Q kill-window

bind -n M-\{ swap-window -t -1
bind -n M-\} swap-window -t +1

bind -n M-\\ split-window -v
bind -n M-Enter split-window -h
bind -n M-q kill-pane
bind -n M-f resize-pane -Z

bind -n M-BSpace clear-history

bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

bind -n C-M-h resize-pane -L 5
bind -n C-M-l resize-pane -R 5
bind -n C-M-k resize-pane -U 5
bind -n C-M-j resize-pane -D 5

bind -n M-, select-pane -L \; swap-pane -t '!'
bind -n M-. select-pane -R \; swap-pane -t '!'
bind -n M-K select-pane -U \; swap-pane -t '!'
bind -n M-J select-pane -D \; swap-pane -t '!'

bind -n M-p run "xclip -o -selection clipboard | tmux load-buffer - ; tmux paste-buffer"

bind -n M-i display-panes


bind-key -T copy-mode-vi v if-shell -F '#{selection_present}' 'send-keys -X clear-selection' 'send-keys -X begin-selection'
bind-key -T copy-mode-vi y send-keys -X copy-pipe "xclip -selection clipboard -i"
bind-key -T copy-mode-vi Escape send-keys -X cancel

set -g default-shell /usr/bin/zsh
set -g mouse on

# Color scheme: pure black/grey/white (matches Kitty/Neovim chrome).
# Status bar uses the exact same bg/fg as Neovim's Normal group.
set -g status-style bg=#0d0d0d,fg=#b8b8b8

set -g display-panes-time 500
set -g display-panes-active-colour colour255
set -g display-panes-colour colour245

set -g pane-border-lines single
set -g pane-border-indicators arrows
set -g pane-border-status off
set -g pane-border-style fg=colour242
set -g pane-active-border-style fg=colour250

set -sg escape-time 0

# Plugins (managed by TPM: https://github.com/tmux-plugins/tpm)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on'

# Initializes TPM — keep this line at the very bottom of tmux.conf.
run '~/.tmux/plugins/tpm/tpm'
