font_family JetBrainsMono Nerd Font
font_size 13.0
bold_font auto
italic_font auto
bold_italic_font auto

enable_audio_bell no

# Animated cursor trail. Tune cursor_trail_decay (fastest slowest, in seconds)
# to taste; set cursor_trail to 0 to disable.
cursor_trail 1
cursor_trail_decay 0.1 0.3
# cursor_trail_start_threshold 2

url_color #0087bd
url_style curly
open_url_with default

# Interface (chrome): black/grey/white. Content (terminal text, ANSI
# colors used by ls/git/bat/etc.) keeps its normal, full-color palette --
# only color0-15 below, if left untouched, come from kitty's own defaults.
background            #0d0d0d
foreground            #e0e0e0
cursor                #ffffff
cursor_text_color     #0d0d0d
selection_background  #4d4d4d
selection_foreground  #ffffff

active_tab_foreground    #0d0d0d
active_tab_background    #e0e0e0
inactive_tab_foreground  #808080
inactive_tab_background  #1a1a1a
tab_bar_background       #0d0d0d

active_border_color    #cccccc
inactive_border_color  #333333
